name: CMake

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}${{ matrix.variant != 'default' && format(' / {0}', matrix.variant) || '' }}

    # Each compiler on each OS builds and tests the default configuration; on Linux with Clang, two more variants check
    # what the default doesn't: tsan (ThreadSanitizer: the races ASan can't see; the tests run once, in a random order)
    # and no-tls (NET_TLS off: the build without Botan).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
        compiler: [gcc, clang]
        variant: [default]
        include:
        - os: ubuntu-26.04
          compiler: clang
          variant: tsan
        - os: ubuntu-26.04
          compiler: clang
          variant: no-tls

    runs-on: ${{ matrix.os }}

    # The latest major versions of both compilers: on Linux, Arch's packages (GCC 16 and Clang 23, as of October 2026),
    # as Ubuntu's (and apt.llvm.org's stable ones) lag behind; on macOS, Homebrew's.
    # NOTE: tsan's container runs without Docker's default seccomp profile, which forbids the personality() call
    #       ThreadSanitizer makes to run itself without ASLR (else it can't map its shadow memory).
    container:
      image: ${{ startsWith(matrix.os, 'ubuntu') && 'archlinux:base-devel' || '' }}
      options: ${{ matrix.variant == 'tsan' && '--security-opt seccomp=unconfined' || '' }}

    steps:
    # NOTE: before checking out, so that it uses git (for the vcpkg submodule) rather than downloading an archive.
    - name: Install tools (Linux)
      if: runner.os == 'Linux'
      run: pacman -Syu --noconfirm --needed git cmake ninja clang curl zip unzip tar zstd pkgconf ccache

    - name: Install tools (macOS)
      if: runner.os == 'macOS'
      run: brew install gcc llvm ninja ccache

    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Select compilers (Linux)
      if: runner.os == 'Linux'
      run: |
        if [ "${{ matrix.compiler }}" = gcc ]; then
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
        else
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
        fi

    # NOTE: Homebrew's, as macOS' own gcc and clang are Apple's clang.
    - name: Select compilers (macOS)
      if: runner.os == 'macOS'
      run: |
        if [ "${{ matrix.compiler }}" = gcc ]; then
          gcc_major="$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)"
          echo "CC=$(brew --prefix gcc)/bin/gcc-${gcc_major}" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix gcc)/bin/g++-${gcc_major}" >> "$GITHUB_ENV"
        else
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
        fi

    - name: Show compiler versions
      run: |
        "$CC" --version
        "$CXX" --version

    # Caches: vcpkg's built packages (e.g. Botan, which takes a while), and ccache's of this project's compilation. Each
    # is keyed by the compiler's version, as what one builds doesn't suit another's. NOTE: relative paths, and
    # $GITHUB_WORKSPACE in the steps, as ${{ github.workspace }} is the host's path, not the container's, on Linux.
    - name: Cache settings
      id: cache
      run: |
        echo "compiler=$("$CXX" --version | head -1 | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
        echo "vcpkg=$(git -c safe.directory='*' -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        mkdir -p .cache/vcpkg .cache/ccache
        echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.cache/vcpkg,readwrite" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache" >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"

    # vcpkg's packages change with its baseline (the submodule), the manifest, and the overlay ports.
    - name: Restore vcpkg's packages
      id: vcpkg-cache
      uses: actions/cache/restore@v6
      with:
        path: .cache/vcpkg
        key: vcpkg-${{ matrix.os }}-${{ steps.cache.outputs.compiler }}${{ matrix.variant != 'default' && format('-{0}', matrix.variant) || '' }}-${{ steps.cache.outputs.vcpkg }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
        restore-keys: vcpkg-${{ matrix.os }}-${{ steps.cache.outputs.compiler }}${{ matrix.variant != 'default' && format('-{0}', matrix.variant) || '' }}-

    # ccache's changes with every commit, so each run saves its own, starting from the latest.
    - name: Restore ccache's cache
      id: ccache-cache
      uses: actions/cache/restore@v6
      with:
        path: .cache/ccache
        key: ccache-${{ matrix.os }}-${{ steps.cache.outputs.compiler }}${{ matrix.variant != 'default' && format('-{0}', matrix.variant) || '' }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.os }}-${{ steps.cache.outputs.compiler }}${{ matrix.variant != 'default' && format('-{0}', matrix.variant) || '' }}-

    # The variants only build what they check: the tests (no examples, benchmarks or fuzz targets). Every job runs the
    # tests that need the network too (NET_NETWORK_TESTS: off by default).
    - name: Configure CMake
      run: |
        set -- -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DBUILD_TESTING=ON -DNET_NETWORK_TESTS=ON
        case "${{ matrix.variant }}" in
          default) set -- "$@" -DBUILD_EXAMPLE=ON ;;
          *)       set -- "$@" -DBUILD_EXAMPLE=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_FUZZING=OFF ;;
        esac
        case "${{ matrix.variant }}" in
          tsan)   set -- "$@" "-DCMAKE_C_FLAGS_DEBUG=-g -fsanitize=thread" "-DCMAKE_CXX_FLAGS_DEBUG=-g -fsanitize=thread" ;;
          no-tls) set -- "$@" -DNET_TLS=OFF ;;
        esac
        cmake "$@"

    - name: Build
      id: build
      run: cmake --build build --parallel

    # NOTE: saved even if a later step fails (e.g. a test), as what was built is still good.
    - name: Save vcpkg's packages
      if: always() && steps.vcpkg-cache.outputs.cache-primary-key != '' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .cache/vcpkg
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

    - name: Show ccache's statistics
      if: always() && steps.ccache-cache.outputs.cache-primary-key != ''
      run: ccache --show-stats

    - name: Save ccache's cache
      if: always() && steps.ccache-cache.outputs.cache-primary-key != ''
      uses: actions/cache/save@v6
      with:
        path: .cache/ccache
        key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

    # NOTE: a ThreadSanitizer report fails its test (TSan exits with 66), and a random order shakes out more.
    - name: Test
      run: |
        if [ "${{ matrix.variant }}" = tsan ]; then
          ctest --test-dir build --output-on-failure --schedule-random
        else
          ctest --test-dir build --output-on-failure
        fi

    # clang-tidy, with warnings as errors, on the C++ files the change touches: a pull request's against its base, a
    # push's against what it replaced (or, for a new branch, or a force push whose old commit isn't in the clone, its
    # parent). The sources in the compile database, and the headers of the project's own directories, whose commands
    # clang-tidy infers from it (a nearby source's, as a header). Once, with Clang on Linux, after the build (which made
    # the compile database), even if the tests failed.
    - name: Lint the changed files
      if: always() && steps.build.outcome == 'success' && runner.os == 'Linux' && matrix.compiler == 'clang' && matrix.variant == 'default'
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        git config --global --add safe.directory '*'
        if [ "$EVENT" = pull_request ]; then
          base="origin/$BASE_REF"
        elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
          base="$BEFORE"
        else
          base="HEAD^"
        fi
        echo "Changes since: $base"

        git diff --name-only --diff-filter=d "$base"...HEAD -- '*.cpp' '*.hpp' '*.h' > changed.txt
        python3 - <<'PY' > lint.txt
        import json, os
        compiled = {os.path.relpath(e["file"]) for e in json.load(open("build/compile_commands.json"))}
        own = ("include/", "src/", "test/", "bench/", "example/", "fuzz/")
        for line in open("changed.txt"):
            path = line.strip()
            if path in compiled or (path.endswith((".hpp", ".h")) and path.startswith(own)): print(path)
        PY

        echo "Linting:"; cat lint.txt
        if [ -s lint.txt ]; then
          xargs -P "$(nproc)" -n 1 clang-tidy -p build --quiet --warnings-as-errors='*' < lint.txt
        fi

  # Formatting: every C++ file with clang-format, and every CMake file (but the overlay ports', which are vcpkg's) with
  # cmake-format, as they're configured. clang-format is PyPI's, pinned to a major version, so a new one (which formats
  # differently) is taken deliberately, with a commit that reformats.
  format:
    runs-on: ubuntu-26.04
    container: archlinux:base-devel

    steps:
    - name: Install tools
      run: pacman -Syu --noconfirm --needed git python

    - uses: actions/checkout@v7

    - name: Install the formatters
      run: |
        python -m venv .venv
        .venv/bin/pip install --quiet 'clang-format==23.*' cmakelang==0.6.13 pyyaml

    - name: Check C++ formatting
      run: |
        git config --global --add safe.directory '*'
        .venv/bin/clang-format --version
        git ls-files '*.cpp' '*.hpp' '*.h' | xargs .venv/bin/clang-format --dry-run --Werror

    - name: Check CMake formatting
      run: git ls-files 'CMakeLists.txt' '*/CMakeLists.txt' '*.cmake' ':!ports/' | xargs .venv/bin/cmake-format --check

  # The check master's branch protection requires, which passes only if every job of the matrix, and the formatting
  # check, did: so they can change without changing the protection.
  build:
    needs: [test, format]
    if: always()
    runs-on: ubuntu-26.04
    steps:
    - name: Check the results
      run: |
        test "${{ needs.test.result }}" = success
        test "${{ needs.format.result }}" = success
