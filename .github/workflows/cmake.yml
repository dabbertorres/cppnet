name: CMake

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
        compiler: [gcc, clang]

    runs-on: ${{ matrix.os }}

    # The latest major versions of both compilers: on Linux, Arch's packages (GCC 16 and Clang 23, as of October 2026),
    # as Ubuntu's (and apt.llvm.org's stable ones) lag behind; on macOS, Homebrew's.
    container: ${{ startsWith(matrix.os, 'ubuntu') && 'archlinux:base-devel' || '' }}

    steps:
    # NOTE: before checking out, so that it uses git (for the vcpkg submodule) rather than downloading an archive.
    - name: Install tools (Linux)
      if: runner.os == 'Linux'
      run: pacman -Syu --noconfirm --needed git cmake ninja clang curl zip unzip tar zstd pkgconf ccache

    - name: Install tools (macOS)
      if: runner.os == 'macOS'
      run: brew install gcc llvm ninja ccache

    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Select compilers (Linux)
      if: runner.os == 'Linux'
      run: |
        if [ "${{ matrix.compiler }}" = gcc ]; then
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
        else
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
        fi

    # NOTE: Homebrew's, as macOS' own gcc and clang are Apple's clang.
    - name: Select compilers (macOS)
      if: runner.os == 'macOS'
      run: |
        if [ "${{ matrix.compiler }}" = gcc ]; then
          gcc_major="$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)"
          echo "CC=$(brew --prefix gcc)/bin/gcc-${gcc_major}" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix gcc)/bin/g++-${gcc_major}" >> "$GITHUB_ENV"
        else
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
        fi

    - name: Show compiler versions
      run: |
        "$CC" --version
        "$CXX" --version

    # Caches: vcpkg's built packages (e.g. Botan, which takes a while), and ccache's of this project's compilation. Each
    # is keyed by the compiler's version, as what one builds doesn't suit another's. NOTE: relative paths, and
    # $GITHUB_WORKSPACE in the steps, as ${{ github.workspace }} is the host's path, not the container's, on Linux.
    - name: Cache settings
      id: cache
      run: |
        echo "compiler=$("$CXX" --version | head -1 | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
        echo "vcpkg=$(git -c safe.directory='*' -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        mkdir -p .cache/vcpkg .cache/ccache
        echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.cache/vcpkg,readwrite" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$GITHUB_WORKSPACE/.cache/ccache" >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"

    # vcpkg's packages change with its baseline (the submodule), the manifest, and the overlay ports.
    - name: Restore vcpkg's packages
      id: vcpkg-cache
      uses: actions/cache/restore@v6
      with:
        path: .cache/vcpkg
        key: vcpkg-${{ matrix.os }}-${{ steps.cache.outputs.compiler }}-${{ steps.cache.outputs.vcpkg }}-${{ hashFiles('vcpkg.json', 'ports/**') }}
        restore-keys: vcpkg-${{ matrix.os }}-${{ steps.cache.outputs.compiler }}-

    # ccache's changes with every commit, so each run saves its own, starting from the latest.
    - name: Restore ccache's cache
      id: ccache-cache
      uses: actions/cache/restore@v6
      with:
        path: .cache/ccache
        key: ccache-${{ matrix.os }}-${{ steps.cache.outputs.compiler }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.os }}-${{ steps.cache.outputs.compiler }}-

    - name: Configure CMake
      run: >-
        cmake -G Ninja -B build
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_C_COMPILER="$CC"
        -DCMAKE_CXX_COMPILER="$CXX"
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DBUILD_TESTING=ON
        -DBUILD_EXAMPLE=ON

    - name: Build
      id: build
      run: cmake --build build --parallel

    # NOTE: saved even if a later step fails (e.g. a test), as what was built is still good.
    - name: Save vcpkg's packages
      if: always() && steps.vcpkg-cache.outputs.cache-primary-key != '' && steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .cache/vcpkg
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

    - name: Show ccache's statistics
      if: always() && steps.ccache-cache.outputs.cache-primary-key != ''
      run: ccache --show-stats

    - name: Save ccache's cache
      if: always() && steps.ccache-cache.outputs.cache-primary-key != ''
      uses: actions/cache/save@v6
      with:
        path: .cache/ccache
        key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

    - name: Test
      run: ctest --test-dir build --output-on-failure

    # clang-tidy, with warnings as errors, on the C++ files the change touches (of those in the compile database): a
    # pull request's against its base, a push's against what it replaced. Once, with Clang on Linux, after the build
    # (which made the compile database), even if the tests failed.
    - name: Lint the changed files
      if: always() && steps.build.outcome == 'success' && runner.os == 'Linux' && matrix.compiler == 'clang'
      run: |
        git config --global --add safe.directory '*'
        if [ "${{ github.event_name }}" = pull_request ]; then
          base="origin/${{ github.base_ref }}"
        else
          base="${{ github.event.before }}"
        fi

        git diff --name-only --diff-filter=d "$base"...HEAD -- '*.cpp' > changed.txt
        python3 - <<'PY' > lint.txt
        import json, os
        compiled = {os.path.relpath(e["file"]) for e in json.load(open("build/compile_commands.json"))}
        for line in open("changed.txt"):
            if line.strip() in compiled: print(line.strip())
        PY

        echo "Linting:"; cat lint.txt
        if [ -s lint.txt ]; then
          xargs -P "$(nproc)" -n 1 clang-tidy -p build --quiet --warnings-as-errors='*' < lint.txt
        fi

  # Formatting: every C++ file with clang-format (the latest, as the Linux jobs' compilers are), and every CMake file
  # with cmake-format, as they're configured.
  format:
    runs-on: ubuntu-26.04
    container: archlinux:base-devel

    steps:
    - name: Install tools
      run: pacman -Syu --noconfirm --needed git clang python

    - uses: actions/checkout@v7

    - name: Check C++ formatting
      run: |
        git config --global --add safe.directory '*'
        clang-format --version
        git ls-files '*.cpp' '*.hpp' '*.h' | xargs clang-format --dry-run --Werror

    - name: Check CMake formatting
      run: |
        python -m venv .venv
        .venv/bin/pip install --quiet cmakelang==0.6.13 pyyaml
        git ls-files 'CMakeLists.txt' '*/CMakeLists.txt' '*.cmake' | xargs .venv/bin/cmake-format --check

  # The check master's branch protection requires, which passes only if every job of the matrix, and the formatting
  # check, did: so they can change without changing the protection.
  build:
    needs: [test, format]
    if: always()
    runs-on: ubuntu-26.04
    steps:
    - name: Check the results
      run: |
        test "${{ needs.test.result }}" = success
        test "${{ needs.format.result }}" = success
